name: Dependency Refresh

on:
  push:
    branches: [fix/poc-next-dependencies-batch-5]
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/poc-next-dependencies-batch-5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align package metadata
        run: |
          npm pkg set scripts.lint="eslint ."
          npm pkg set engines.node=">=20.9.0"
      - name: Upgrade framework and lint toolchain
        run: |
          npm install next@16.4.0 --save --no-audit --no-fund
          npm install eslint@latest eslint-config-next@16.4.0 --save-dev --no-audit --no-fund
          npm audit fix --no-fund || true
      - name: Commit refreshed manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
          else
            git commit -m "chore(deps): refresh secure Next.js dependency graph"
            git push origin HEAD:fix/poc-next-dependencies-batch-5
          fi
